name: Build SingProxy Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      singbox_tag:
        description: "sing-box tag (留空 = 自动取最新 v1.12.x)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack sources
        run: |
          mkdir -p src
          unzip -o SingProxy-sources.zip -d src
          ls -R src | head -40

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Resolve sing-box tag
        id: sbtag
        run: |
          TAG="${{ inputs.singbox_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags https://github.com/SagerNet/sing-box 'v1.12.*' | grep -v '\^{}' | sed 's/.*refs\/tags\///' | sort -V | tail -1)
          fi
          echo "sing-box tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Libbox.xcframework
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          gomobile init
          git clone --depth 1 --branch "${{ steps.sbtag.outputs.tag }}" https://github.com/SagerNet/sing-box.git sing-box
          cd sing-box
          make lib_ios
          find . -name "Libbox.xcframework" -maxdepth 2
          cp -r Libbox.xcframework ../src/
          ls ../src/Libbox.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: src
        run: |
          xcodegen generate
          ls SingProxy.xcodeproj/xcshareddata/xcschemes/ || echo "no shared schemes yet"

      - name: Ensure shared scheme
        working-directory: src
        run: |
          if [ ! -f SingProxy.xcodeproj/xcshareddata/xcschemes/SingProxy.xcscheme ]; then
            gem install --no-document xcodeproj
            ruby -e "
              require 'xcodeproj'
              proj = Xcodeproj::Project.open('SingProxy.xcodeproj')
              app = proj.targets.find { |t| t.name == 'SingProxy' }
              scheme = Xcodeproj::XCScheme.new
              scheme.add_build_target(app)
              scheme.set_launch_target(app)
              scheme.save_as('SingProxy.xcodeproj', 'SingProxy')
            "
          fi
          ls SingProxy.xcodeproj/xcshareddata/xcschemes/

      - name: Build app (unsigned)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            -project SingProxy.xcodeproj \
            -scheme SingProxy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tail -60

      - name: Embed entitlements (ldid)
        working-directory: src
        run: |
          # 未签构建不会把 entitlements 写进二进制，且 codesign 会剥掉主 App 的
          # networkextension 权限，故改用 ldid 原样嵌入两份权限文件，
          # 让 TrollStore 等保留权限的安装方式拿到 App Group + 网络扩展权限。
          brew install ldid
          APP=$(find build -name "SingProxy.app" -type d | head -1)
          APEX="$APP/PlugIns/SingProxyTunnel.appex"
          ldid -SSingProxyTunnel.entitlements "$APEX/SingProxyTunnel"
          ldid -SSingProxy.entitlements "$APP/SingProxy"
          echo "--- app entitlements ---"
          ldid -e "$APP/SingProxy" || true
          echo "--- appex entitlements ---"
          ldid -e "$APEX/SingProxyTunnel" || true

      - name: Package IPA
        working-directory: src
        run: |
          APP=$(find build -name "SingProxy.app" -type d | head -1)
          echo "App: $APP"
          ls "$APP"
          ls "$APP/PlugIns" || true
          rm -rf Payload && mkdir Payload
          cp -r "$APP" Payload/
          zip -qry SingProxy-unsigned.ipa Payload
          ls -la SingProxy-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingProxy-unsigned-ipa
          path: src/SingProxy-unsigned.ipa
